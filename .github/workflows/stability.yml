name: Stability

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.19.0
          - 22
          - 24
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit

  platform-compatibility:
    name: ${{ matrix.os }} / Node.js 22
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          FLOWUP_REQUIRE_NODE_RED_INTEGRATION: '1'

  node-red-compatibility:
    name: Node-RED ${{ matrix.node_red }} / Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_red: 4.1.6
            node: 20.19.0
          - node_red: 5.0.0
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wry-smile/flowup build
      - run: npm install --prefix .node-red-test --no-package-lock --no-save node-red@${{ matrix.node_red }}
      - run: node --test cli/test/node-red-integration.test.mjs
        env:
          FLOWUP_NODE_RED_MODULE: ${{ github.workspace }}/.node-red-test/node_modules/node-red
          FLOWUP_REQUIRE_NODE_RED_INTEGRATION: '1'
