minimumReleaseAgeExclude:
  - '@types/node@26.0.1'

shellEmulator: true

trustPolicy: no-downgrade

packages:
  - cli
  - packages/nodes/**
  - packages/plugins/**

overrides:
  '@wry-smile/flowup': link:./cli

catalog:
  '@clack/prompts': ^1.6.0
  '@types/js-yaml': ^4.0.9
  '@types/micromatch': ^4.0.10
  '@types/node': ^26.0.1
  '@types/node-red': ^1.3.5
  '@vitejs/plugin-vue': ^6.0.7
  '@wry-smile/utils': ^1.1.3
  bumpp: ^11.1.0
  commander: ^15.0.0
  find-up: ^8.0.0
  js-yaml: ^5.1.0
  micromatch: ^4.0.8
  node-red: ^5.0.0
  oxfmt: ^0.70.0
  oxlint: ^1.85.0
  tsdown: ^0.22.3
  typescript: ^6.0.3
  vite: ^8.1.0

allowBuilds:
  esbuild: false
